info_offline=Offline
info_page=Strona %s / %s
info_previous=Poprzednia strona
info_next=Następna strona
info_close=Zamknij
help_title=Bongo's Community Clans — komendy
help_create=/clan create <name> <tag> — utwórz klan; tag ze spacją podaj w cudzysłowie.
help_members=/clan invite <username> | accept | decline | ignore | kick <username> | leave
help_roles=/clan promote <username> <class> | demote <username> <class> | transfer <username>
help_change=/clan change name <name> | tag <tag> — kolory w tagu: &0–&f lub &#RRGGBB, np. &1Super&4Clan.
help_chat=/clan chat <wiadomość> | quickchat — przełącz #czat klanowy
help_info=/clan info [strona] — ekwipunkowe informacje; /clan delete — potwierdzenie po 10 s
help_ranks=Rangi: founder / cofounder / manager / member. Każdy gracz może należeć do jednego klanu.
cat_pack_prompt=Pobierz paczkę zasobów, aby zobaczyć i usłyszeć klaskającego kota.
cat_not_loaded=Paczka kota nie jest załadowana. Dołącz ponownie do serwera i zaakceptuj paczkę zasobów przed wejściem do świata.
