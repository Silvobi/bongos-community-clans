prefix=[Klany] 
create_usage=Użycie: /clan create <name> <tag>
no_clan=Nie należysz do klanu. Utwórz go przez /clan create <name> <tag>.
already_clan=Należysz już do klanu.
no_permission=Twoja ranga nie pozwala na tę czynność.
bad_name=Nazwa musi mieć 1–32 znaki: litery, cyfry, myślnik, podkreślenie lub kropka. Kody kolorów są niedozwolone.
bad_tag=Tag musi mieć 1–12 znaków Unicode bez kodów kolorów (&0–&f lub &#RRGGBB). Nie może być pusty ani zawierać znaków sterujących, nowych linii lub §.
bad_role=Rangi: cofounder, manager, member (także polskie nazwy).
name_taken=Klan z taką nazwą już istnieje.
tag_taken=Ten tag jest już zajęty.
target_has_clan=Ten gracz należy już do klanu.
ignores_invites=Ten gracz ignoruje zaproszenia.
invite_pending=Ten gracz ma już aktywne zaproszenie. Poczekaj, aż je przyjmie, odrzuci lub aż wygaśnie.
no_invite=Nie masz ważnego zaproszenia. Zaproszenia wygasają po 5 minutach.
not_member=Nie ma takiego członka w Twoim klanie.
hierarchy=Nie możesz zarządzać sobą ani osobą z równą lub wyższą rangą. Awans/degradacja musi zmienić rangę we właściwym kierunku.
founder_leave=Najpierw przekaż założyciela: /clan transfer <username>, albo usuń klan przez /clan delete.
delete_expired=Potwierdzenie wygasło lub klan/założyciel się zmienił. Użyj ponownie /clan delete.
delete_wait=Poczekaj na zakończenie 10-sekundowego odliczania.
player_only=Ta komenda jest dostępna dla graczy.
player_offline=Gracz musi być online, aby otrzymać zaproszenie.
save_failed=Nie udało się zapisać zmiany. Sprawdź log serwera; zmiana nie została zastosowana.
unavailable=Klany są niedostępne z powodu błędu danych. Sprawdź log serwera.
created=Utworzono klan %s [%s]. Jesteś założycielem.
invited=Zaproszono %s. Zaproszenie jest ważne przez 5 minut.
invitation=%s zaprasza Cię do klanu %s [%s]. /clan accept — dołącz, /clan decline — odrzuć, /clan ignore — blokuj zaproszenia.
accepted=%s dołączył(a) do klanu.
declined=Odrzucono zaproszenie.
ignore_on=Ignorowanie zaproszeń włączone. Obecne zaproszenie zostało odrzucone.
ignore_off=Ignorowanie zaproszeń wyłączone.
quick_on=Quickchat włączony: #wiadomość wysyła wiadomość tylko do klanu. ##wiadomość pozostaje publiczna (z oboma #).
quick_off=Quickchat wyłączony.
kicked=%s usunął/usunęła %s z klanu.
you_kicked=Usunięto Cię z klanu %s.
left=%s opuścił(a) klan.
you_left=Opuszczono klan %s.
role_changed=%s ma teraz rangę: %s.
transfer_done=%s jest nowym założycielem klanu. Poprzedni założyciel ma rangę współzałożyciela.
changed_name=Nazwa klanu została zmieniona na %s.
changed_tag=Tag klanu został zmieniony na [%s].
deleted=Klan %s został usunięty.
